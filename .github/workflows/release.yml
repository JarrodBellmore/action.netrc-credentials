name: Release

# When a new release is published:
# 1. Build the dist/ and commit it into the release tag (consumers need dist/index.js)
# 2. Update floating major and minor version tags (v1, v1.2) to point to this release,
#    so consumers pinned to a major version automatically receive minor/patch updates.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    name: Build and Update Version Tags
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}

      - name: Install Task
        uses: arduino/setup-task@v3

      - name: Configure Git authentication for remote Taskfiles
        uses: JarrodBellmore/action.netrc-credentials@v0
        with:
          password: ${{ secrets.SHARED_REPO_TOKEN }}

      - name: Build
        env:
          TASK_X_REMOTE_TASKFILES: 1
          GITHUB_TOKEN: ${{ secrets.SHARED_REPO_TOKEN }}
        run: task build -y

      - name: Commit dist/ to release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add --force dist/
          git commit -m "chore: build dist for release ${{ github.ref_name }}" || echo "Nothing to commit"
          git tag -fa "${{ github.ref_name }}" -m "Release ${{ github.ref_name }}"
          git push origin "${{ github.ref_name }}" --force

      - name: Update floating version tags
        run: |
          TAG="${{ github.ref_name }}"
          MAJOR=$(echo "$TAG" | cut -d. -f1)
          MINOR=$(echo "$TAG" | cut -d. -f1-2)
          git tag -fa "$MAJOR" -m "Update $MAJOR tag to $TAG"
          git tag -fa "$MINOR" -m "Update $MINOR tag to $TAG"
          git push origin "$MAJOR" --force
          git push origin "$MINOR" --force
