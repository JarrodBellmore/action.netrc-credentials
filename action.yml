name: netrc Credentials
description: >
  Writes a .netrc entry for the specified machine so CLI tools (e.g. Git, curl)
  can authenticate without embedding credentials in URLs.
author: JarrodBellmore
# Add your action's branding here. This will appear on the GitHub Marketplace.
branding:
  icon: lock
  color: blue

# Define your inputs here.
inputs:
  machine:
    description: The hostname to authenticate (e.g. github.com)
    required: true
    default: github.com
  login:
    description: The login / username for the machine
    required: true
    default: x-access-token
  password:
    description: The password or token for the machine
    required: true

# Define your outputs here.
outputs:
  netrc-path:
    description: Absolute path to the .netrc file that was written
  netrc-contents:
    description: Full contents of the .netrc file (useful for debugging)

runs:
  using: node24
  main: dist/index.js
